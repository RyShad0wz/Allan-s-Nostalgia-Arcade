<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allan's Nostalgic Arcade - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #f0f0f0;
            text-align: center;
            overflow: hidden;
            position: relative;
            height: 100vh;
        }

        /* Navbar */
        .navbar {
            background-color: #333;
            padding: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #04ff00;
            position: fixed;
            top: 0;
            z-index: 100;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .navbar a {
            color: #04ff00;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        /* Burger menu */
        .burger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .burger div {
            width: 25px;
            height: 3px;
            background-color: #04ff00;
            margin: 4px;
            transition: all 0.3s ease;
        }

        /* Sidebar */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            right: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            z-index: 150;
        }

        .sidebar a {
            padding: 10px 15px;
            text-decoration: none;
            font-size: 18px;
            color: #04ff00;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #575757;
        }

        /* Close button inside sidebar */
        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        /* Responsive styling */
        @media screen and (max-width: 768px) {
            .navbar h1 {
                font-size: 20px;
            }
            .navbar a {
                display: none; /* Hide navbar links on mobile */
            }
            .burger {
                display: flex; /* Show burger menu on mobile */
            }
        }

        .change .bar1 {
            transform: rotate(-45deg) translate(-5px, 6px);
        }

        .change .bar2 {
            opacity: 0;
        }

        .change .bar3 {
            transform: rotate(45deg) translate(-5px, -6px);
        }

        /* Animation background */
        .space-invaders {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .invader {
            position: absolute;
            width: 50px;
            height: 50px;
            background-image: url('invader.png'); /* Une image de Space Invader */
            background-size: contain;
            background-repeat: no-repeat;
            animation: moveInvader 10s linear infinite;
        }

        @keyframes moveInvader {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100vh); }
        }

        .container {
            padding: 20px;
            position: relative;
            z-index: 10;
            height: 100%; /* Prend toute la hauteur de l'écran */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 36px;
            color: #04ff00;
            text-shadow: 2px 2px #000;
            margin-bottom: 20px;
            animation: fadeInSlide 2s ease-out;
        }

        p {
            font-size: 16px;
            max-width: 600px;
            margin-bottom: 50px;
        }

        @keyframes fadeInSlide {
            from { transform: translateY(-100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .swiper-container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .swiper-slide img {
            width: 200px; /* Largeur fixe des images */
            height: 150px; /* Hauteur fixe des images */
            object-fit: cover; /* Remplit le conteneur tout en maintenant l'aspect ratio */
            border-radius: 10px;
            cursor: pointer; /* Le curseur change pour indiquer que l'image est cliquable */
        }

        .swiper-slide {
            background: none; /* Supprime le fond gris autour des images */
        }

        .swiper-pagination {
        display: none;
        }

/* Style des flèches de navigation */
.swiper-button-prev, .swiper-button-next {
    width: 50px;
    height: 50px;
    color: #04ff00; /* Vert rétro */
    font-size: 40px; /* Taille du texte */
    font-family: 'Press Start 2P', cursive; /* Police de style pixelisé */
    display: flex;
    align-items: center;
    justify-content: center;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    cursor: pointer;
}

/* Style de la flèche précédente */
.swiper-button-prev::before {
    content: "<"; /* Flèche gauche */
}

/* Style de la flèche suivante */
.swiper-button-next::before {
    content: ">"; /* Flèche droite */
}

/* Position des flèches */
.swiper-button-prev {
    left: 10px;
}

.swiper-button-next {
    right: 10px;
}

/* Agrandir la zone cliquable pour les flèches */
.swiper-button-prev::after, .swiper-button-next::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    left: 0;
    top: 0;
}

footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background-color: #333;
    color: #04ff00;
    font-family: 'Press Start 2P', cursive;
    font-size: 12px;
    text-align: center; 
    padding: 10px 0;
    z-index: 100;
    box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.5);
}

footer p {
    margin: 0;
}

/* Agrandir la miniature au survol */
.swiper-slide img {
    transition: transform 0.3s ease;
}

.swiper-slide:hover img {
    transform: scale(1.2); /* Agrandit la miniature */
}

/* Style du texte "clique pour jouer" */
.play-text {
    position: absolute;
    color: #04ff00; /* Vert rétro */
    font-family: 'Press Start 2P', cursive;
    font-size: 14px;
    pointer-events: none; /* Le texte ne bloque pas le clic sur l'image */
    z-index: 20;
    display: none; /* Caché par défaut */
}

    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <h1>Allan's Nostalgic Arcade</h1>
        <div class="burger" onclick="toggleBurger(this)">
            <div class="bar1"></div>
            <div class="bar2"></div>
            <div class="bar3"></div>
        </div>
        <div>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
    </div>

    <!-- Arrière-plan animé avec Space Invaders -->
    <div class="space-invaders">
        <div class="invader" style="top: -100px; left: 10%;"></div>
        <div class="invader" style="top: -150px; left: 30%; animation-delay: 2s;"></div>
        <div class="invader" style="top: -200px; left: 50%; animation-delay: 4s;"></div>
        <div class="invader" style="top: -250px; left: 70%; animation-delay: 6s;"></div>
        <div class="invader" style="top: -300px; left: 90%; animation-delay: 8s;"></div>
    </div>

    <div class="container">
        <h1>Allan's Nostalgic Arcade</h1>
        <p>Bienvenue dans l'arcade nostalgique où vous pouvez revivre les jeux classiques qui ont marqué l'histoire.</p>
        
        <p>Explorez, jouez et profitez des souvenirs inoubliables de l'âge d'or du jeu vidéo.</p>
        <div class="swiper-container">
            <div class="swiper-wrapper">
                <div class="swiper-slide" onclick="window.location.href='game.html?game=pacman-flash&title=Pac%20-%20Man'">
                    <img src="pacman.jpg" alt="Pac-Man">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=sonic&title=Sonic'">
                    <img src="sonic.jpg" alt="Sonic">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=smash&title=Super%20Smash%20Flash'">
                    <img src="smash.jpg" alt="Super Smash Flash">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=sonicrpg&title=Sonic%20RPG'">
                    <img src="sonicrpg.jpg" alt="Sonic RPG">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=ben10&title=Ben%2010'">
                    <img src="ben10.jpg" alt="Ben 10">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=spiderman&title=Spiderman'">
                    <img src="spiderman.jpg" alt="Spiderman">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=mario&title=Mario'">
                    <img src="mario.jpg" alt="Mario">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=run&title=Run%202'">
                    <img src="run.jpg" alt="Run 2">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=simpsons&title=Simpsons'">
                    <img src="simpsons.jpg" alt="Simpsons">
                </div>
                <div class="swiper-slide" onclick="window.location.href='game.html?game=lint&title=Lint'">
                    <img src="lint.jpg" alt="Lint">
                </div>
                <!-- Ajoutez d'autres images de jeux ici -->
            </div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            <!-- Add Pagination -->
            <div class="swiper-pagination"></div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>

const swiper = new Swiper('.swiper-container', {
    effect: 'coverflow',
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: 'auto',
    loop: true,
    coverflowEffect: {
        rotate: 50,
        stretch: 0,
        depth: 300,
        modifier: 1.5,
        slideShadows: true,
    },
    navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
    },
});


        function toggleBurger(x) {
            x.classList.toggle("change");
            openNav();
        }

        function openNav() {
            const sidebar = document.getElementById("mySidebar");
            if (sidebar.style.width === "250px") {
                sidebar.style.width = "0";
            } else {
                sidebar.style.width = "250px";
            }
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

         // Créer l'élément pour le texte "clique pour jouer"
    const playText = document.createElement('div');
    playText.classList.add('play-text');
    playText.textContent = 'Clique pour jouer';
    document.body.appendChild(playText);

    // Gérer le survol de chaque miniature
    const slides = document.querySelectorAll('.swiper-slide img');

    slides.forEach(slide => {
        slide.addEventListener('mouseenter', (e) => {
            playText.style.display = 'block';
        });

        slide.addEventListener('mouseleave', (e) => {
            playText.style.display = 'none';
        });

        slide.addEventListener('mousemove', (e) => {
            // Positionner le texte à côté du curseur
            playText.style.left = e.pageX + 15 + 'px'; // Décale le texte un peu à droite du curseur
            playText.style.top = e.pageY + 15 + 'px';  // Décale le texte un peu en bas du curseur
        });
    });

    // Ajoute un écouteur d'événements pour les touches du clavier
document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowLeft') {
        // Si la touche "Flèche gauche" est pressée
        swiper.slidePrev(); // Passe au slide précédent
    } else if (event.key === 'ArrowRight') {
        // Si la touche "Flèche droite" est pressée
        swiper.slideNext(); // Passe au slide suivant
    }
});

    </script>
    <footer>
        <p>Allan B @2024</p>
    </footer>    
</body>
</html>
