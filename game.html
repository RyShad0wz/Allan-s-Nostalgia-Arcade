<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .navbar {
            background-color: #333;
            padding: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ff6600;
        }
        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }
        .navbar a {
            color: #ff6600;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }
        .game-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #2e2e2e;
            border: 2px solid #444;
            border-radius: 10px;
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .game-container canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        #gameTitle {
            color: #ff6600;
            margin-bottom: 20px;
            font-size: 28px;
        }
        .back-button {
            margin-top: 20px;
            background-color: #ff6600;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-family: 'Press Start 2P', cursive;
        }
        .back-button:hover {
            background-color: #e65c00;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Allan's Nostalgic Arcade</h1>
        <div>
            <a href="index.html">Home</a>
            <a href="#">Games</a>
        </div>
    </div>

    <div class="game-container">
        <h2 id="gameTitle">Loading Game...</h2>
        <div id="game"></div>
    </div>

    <button class="back-button" onclick="window.history.back()">Retour à l'Accueil</button>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.getElementById('gameTitle').innerText = getQueryParam('title');
        document.getElementById('pageTitle').innerText = getQueryParam('title') + " - Allan's Nostalgic Arcade";

        const ruffle = window.RufflePlayer.newest();
        const game = ruffle.createPlayer();
        document.getElementById('game').appendChild(game);
        game.load(getQueryParam('game') + '.swf');
    </script>
</body>
</html>
