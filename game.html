<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('https://i.imgur.com/6WwWV9s.png') repeat top center;
            animation: stars 20s linear infinite;
        }

        @keyframes stars {
            0% { background-position: 0 0; }
            100% { background-position: 10000px 0; }
        }

        .rocket {
            width: 50px;
            height: 100px;
            background: url('https://i.imgur.com/n3xL6gu.png') no-repeat center center;
            background-size: contain;
            position: absolute;
            bottom: 50px;
            animation: fly 3s ease-in-out infinite;
        }

        @keyframes fly {
            0% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }

        .loading-text {
            font-size: 24px;
            color: #04ff00;
            text-align: center;
            margin-top: 200px;
            position: relative;
            z-index: 10;
        }

        .navbar {
            background-color: #333;
            padding: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #04ff00;
            position: absolute;
            top: 0;
            z-index: 10;
        }

        .navbar h1 {
            margin: 0;
            font-size: 24px;
        }

        .navbar a {
            color: #04ff00;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .game-container {
            margin-top: 20px;
            padding: 20px;
            background-color: #2e2e2e;
            border: 2px solid #444;
            border-radius: 10px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .game-container canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        #gameTitle {
            color: #04ff00;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .back-button {
            margin-top: 20px;
            background-color: #04ff00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-family: 'Press Start 2P', cursive;
        }

        .back-button:hover {
            background-color: #04ff00;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #33333300;
            color: #04ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            text-align: center;
            padding: 5px 0;
            z-index: 100;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.5);
        }

        footer p {
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="navbar">
        <h1>Allan's Nostalgic Arcade</h1>
        <div>
            <a href="index.html">Accueil</a>
        </div>
    </div>

    <div class="game-container">
        <h2 id="gameTitle">Loading Game...</h2>
        <div id="game"></div>
    </div>

    <div class="loading-text">Loading...</div>
    
    <div class="rocket"></div>

    <button class="back-button" onclick="window.history.back()">Retour à l'Accueil</button>

    <footer>
        <p>Allan B @2024</p>
    </footer>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        window.onload = function() {
            document.querySelector('.loading-text').style.display = 'none';
            document.querySelector('.rocket').style.display = 'none';
        };

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.getElementById('gameTitle').innerText = getQueryParam('title');
        document.getElementById('pageTitle').innerText = getQueryParam('title') + " - Allan's Nostalgic Arcade";

        const ruffle = window.RufflePlayer.newest();
        const game = ruffle.createPlayer();
        document.getElementById('game').appendChild(game);
        game.load(getQueryParam('game') + '.swf');
    </script>

</body>
</html>
