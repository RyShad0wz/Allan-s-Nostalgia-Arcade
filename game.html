<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #000;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            background-image: url('space.png'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed;
        }

        .navbar {
            background-color: #333;
            padding: 10px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #04ff00;
            box-sizing: border-box;
        }

        .navbar h1 {
            margin: 0;
            font-size: 20px;
            word-wrap: break-word;
        }

        .navbar a {
            color: #04ff00;
            text-decoration: none;
            margin: 0 10px;
            font-size: 12px;
        }

        .game-container {
            margin: 20px 0;
            padding: 20px;
            background-color: #2e2e2e;
            border: 2px solid #444;
            border-radius: 10px;
            width: 100%;
            max-width: 900px;
            text-align: center;
            box-sizing: border-box;
        }

        .game-container canvas {
            width: 100%;
            height: auto;
            border-radius: 10px;
            max-height: 80vh; /* Limite la hauteur à 80% de la hauteur de la fenêtre */
        }

        #gameTitle {
            color: #04ff00;
            margin-bottom: 20px;
            font-size: 22px;
            word-wrap: break-word;
        }

        .back-button {
            margin-top: 20px;
            background-color: #04ff00;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-family: 'Press Start 2P', cursive;
            width: auto;
        }

        .back-button:hover {
            background-color: #04ff00;
        }

        footer {
            position: relative;
            bottom: 0;
            width: 100%;
            background-color: #333;
            color: #04ff00;
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            text-align: center;
            padding: 10px 0;
            z-index: 100;
            box-sizing: border-box;
        }

        footer p {
            margin: 0;
        }

        @media (max-width: 768px) {
            .navbar h1 {
                font-size: 16px;
            }

            .navbar a {
                font-size: 10px;
            }

            .game-container {
                padding: 10px;
            }

            .game-container h2 {
                font-size: 18px;
            }

            .back-button {
                font-size: 12px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>Netflash</h1>
        <div>
            <a href="index.html">Accueil</a>
        </div>
    </div>

    <div class="game-container">
        <h2 id="gameTitle">Loading Game...</h2>
        <div id="game"></div>
    </div>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        document.getElementById('gameTitle').innerText = getQueryParam('title');
        document.getElementById('pageTitle').innerText = getQueryParam('title') + " - Allan's Nostalgic Arcade";

        const ruffle = window.RufflePlayer.newest();
        const game = ruffle.createPlayer();
        document.getElementById('game').appendChild(game);
        game.load(getQueryParam('game') + '.swf');
    </script>   

</body>
</html>
